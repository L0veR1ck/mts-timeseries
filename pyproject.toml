[project]
name = "mts-timeseries"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "numpy==2.5.5",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
